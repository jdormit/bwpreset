[project]
name = "bwpreset"
version = "0.1.0"
requires-python = ">=3.11"
description = "Author Bitwig Studio Grid patches as code"
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
bwgrid = "bwpreset.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.sdist]
include = [
  "/bwpreset",
  "/tests",
  "/docs",
  "/skills",
  "/examples",
  "/tools",
  "/experiments/__init__.py",
  "/experiments/coverage.py",
  "/AGENTS.md",
  "/README.md",
  "/LICENSE",
  "/GRID-GAPS.md",
  "/pyproject.toml",
  "/uv.lock",
]
